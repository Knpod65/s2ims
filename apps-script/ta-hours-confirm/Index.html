<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ยืนยันชั่วโมง TA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1A2E24; --fg:#fff; --card:#fff; --card-fg:#1A1A1A;
  --primary:#2563EB; --primary-h:#1D4ED8; --primary-a:#1E40AF;
  --secondary:#3A4F44; --muted:#2A3D32; --muted-fg:#C8D4CC;
  --accent:#7CB87A; --accent-fg:#0F1A14; --destructive:#B84A3A;
  --border:#5A6B60; --input:#6A7B70; --ring:#2563EB;
  --soft:#EEF3EF; --line:#DCE5DE; --ink2:#55645A;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 Inter,"Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}

/* painterly park plate (flat, illustrative) */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none}
.scene svg{width:100%;height:100%;display:block}
.scrim{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(26,46,36,.25),rgba(26,46,36,.55));pointer-events:none}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.nav{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;gap:12px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:18px}
.brand small{display:block;font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-fg)}
.main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:24px 24px 64px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}
h1{margin:0;font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1.15;letter-spacing:-.02em}
h2{margin:0 0 8px;font-weight:600;font-size:clamp(24px,4vw,32px);line-height:1.2}
.lead{font-size:18px;color:#ECF2EE;max-width:520px;margin:16px auto 0}
.scribble{position:relative;display:inline-block;padding:0 .15em}
.scribble svg{position:absolute;left:-8%;top:-14%;width:116%;height:130%;overflow:visible;pointer-events:none}
.scribble path{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.scribble path{animation:none;stroke-dashoffset:0}}

/* controls — pills, flat */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 26px;border:0;border-radius:9999px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-h)} .btn-primary:active{background:var(--primary-a)}
.btn-light{background:#fff;color:var(--card-fg)} .btn-light:hover{background:#F3F4F6}
.btn-ghost{background:transparent;color:var(--fg);height:40px;padding:0 14px} .btn-ghost:hover{background:var(--secondary)}
.btn-danger{background:#fff;color:var(--destructive);box-shadow:inset 0 0 0 1.5px var(--destructive)} .btn-danger:hover{background:#FBEFEC}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.field{width:100%;height:44px;padding:0 18px;border-radius:9999px;border:1px solid var(--input);background:#fff;color:var(--card-fg)}
.field::placeholder{color:#7a867e}
textarea.field{height:auto;min-height:110px;padding:12px 18px;border-radius:16px;resize:vertical}
.otp{letter-spacing:.5em;text-align:center;font-weight:600;font-size:22px;padding-left:.5em}
.card{background:var(--card);color:var(--card-fg);border:1px solid var(--border);border-radius:16px;padding:24px}
.form{width:100%;max-width:420px;margin:32px auto 0;display:flex;flex-direction:column;gap:12px;text-align:left}
.form label{font-size:13px;font-weight:500;color:#ECF2EE;padding-left:6px}
.hint{font-size:13px;color:var(--muted-fg);text-align:center;margin-top:4px}
.err{background:#fff;color:var(--destructive);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500}
.proof{margin-top:48px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-fg);opacity:.85}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:9999px;background:var(--secondary);color:#fff;font-size:13px;font-weight:500;border:0;cursor:pointer}
.chip[aria-pressed="true"]{background:#fff;color:var(--card-fg)}
.badge{display:inline-block;padding:4px 10px;border-radius:9999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-pending{background:#E6ECE8;color:#3d4a42}
.b-confirmed{background:var(--accent);color:var(--accent-fg)}
.b-reported{background:var(--destructive);color:#fff}
.b-resolved{background:#DBE7FD;color:#1E40AF}

/* student */
.who{margin:8px 0 28px}
.who p{margin:6px 0 0;color:var(--muted-fg)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 4px}
.stat{background:var(--soft);color:var(--card-fg);border-radius:12px;padding:14px 16px}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.stat .v{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stat .v small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:4px}
.stat.total{background:#E4EEE5}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.panel{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.panel label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.note{margin-top:16px;border-radius:12px;background:var(--soft);padding:12px 16px;font-size:14px}
.note b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
.meta{font-size:13px;color:var(--ink2);margin-top:12px}

/* staff */
.alert{display:flex;align-items:center;gap:12px;background:var(--destructive);color:#fff;border-radius:16px;padding:14px 20px;margin-bottom:16px;font-weight:600}
.alert .btn{margin-left:auto;height:36px;padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tool .field{max-width:260px;margin-left:auto}
.list{display:flex;flex-direction:column}
.lr{display:grid;grid-template-columns:minmax(0,2.4fr) .7fr .7fr .7fr 1fr;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.lr.head{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);padding-bottom:8px}
.lr .nm{font-weight:600;overflow-wrap:anywhere} .lr .nm small{display:block;font-weight:400;color:var(--ink2)}
.lr .num{font-variant-numeric:tabular-nums}
.detail{grid-column:1/-1;background:var(--soft);border-radius:12px;padding:12px 16px;font-size:14px}
.detail .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.detail .field{flex:1;min-width:200px;height:40px}
.detail .btn{height:40px}
.empty{padding:32px;text-align:center;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:var(--card-fg);border-radius:9999px;padding:12px 22px;font-weight:600;z-index:10}
@media (max-width:720px){
  .nav{padding:16px}.main{padding:16px 16px 48px}
  .stat-row{grid-template-columns:1fr 1fr}.stat.total{grid-column:1/-1}
  .stats{grid-template-columns:1fr 1fr}
  .lr{grid-template-columns:1fr 1fr 1fr}.lr.head{display:none}
  .lr .nm{grid-column:1/-1}.lr .st{grid-column:1/-1}
  .tool .field{max-width:none;margin-left:0;width:100%}
  .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
<svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D9B0"/><stop offset=".55" stop-color="#C9D8A8"/><stop offset="1" stop-color="#8DB88A"/></linearGradient>
    <linearGradient id="pond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FA3B5"/><stop offset="1" stop-color="#3D7F8F"/></linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#sky)"/>
  <circle cx="1130" cy="190" r="70" fill="#FBE9C6" opacity=".9"/>
  <g fill="#A9C4A0" opacity=".85"><rect x="150" y="380" width="46" height="130"/><rect x="204" y="340" width="38" height="170"/><rect x="250" y="400" width="56" height="110"/><rect x="1020" y="370" width="50" height="140"/><rect x="1078" y="410" width="40" height="100"/><rect x="1126" y="350" width="44" height="160"/></g>
  <path d="M0 520 Q240 430 520 500 T1040 480 T1440 520 V900 H0Z" fill="#7FAE74"/>
  <path d="M0 600 Q300 520 620 590 T1440 560 V900 H0Z" fill="#5E9A62"/>
  <ellipse cx="720" cy="690" rx="330" ry="62" fill="url(#pond)"/>
  <ellipse cx="640" cy="684" rx="120" ry="14" fill="#fff" opacity=".18"/>
  <path d="M0 760 Q360 690 760 770 T1440 730 V900 H0Z" fill="#3E7A4F"/>
  <g><rect x="196" y="540" width="14" height="150" fill="#6B5A44"/><circle cx="203" cy="520" r="78" fill="#4E8A52"/><circle cx="160" cy="560" r="52" fill="#5B9A5E"/><circle cx="250" cy="555" r="55" fill="#468048"/></g>
  <g><rect x="1226" y="520" width="16" height="170" fill="#6B5A44"/><circle cx="1234" cy="490" r="92" fill="#4E8A52"/><circle cx="1180" cy="540" r="60" fill="#5B9A5E"/><circle cx="1292" cy="534" r="62" fill="#468048"/></g>
  <g fill="#E9B86B"><circle cx="420" cy="740" r="7"/><circle cx="470" cy="760" r="6"/><circle cx="1010" cy="750" r="7"/><circle cx="1060" cy="772" r="5"/></g>
</svg>
</div>
<div class="scrim"></div>

<div class="app">
  <header class="nav">
    <div class="brand">S²IMS<small>TA Hours · คณะรัฐศาสตร์ฯ</small></div>
    <div id="navRight"></div>
  </header>
  <main class="main" id="view" aria-live="polite"></main>
</div>

<script>
(function(){
'use strict';
const $view = document.getElementById('view'), $nav = document.getElementById('navRight');
const store = {
  get(){ try{return sessionStorage.getItem('ta_token')}catch(e){return null} },
  set(v){ try{ v ? sessionStorage.setItem('ta_token',v) : sessionStorage.removeItem('ta_token') }catch(e){} }
};
let token = store.get(), pollTimer = null, lastReported = null;

const ERR = {
  invalid_email:'รูปแบบอีเมลไม่ถูกต้อง', cooldown:'ขอรหัสได้อีกครั้งในอีก 1 นาที กรุณารอสักครู่',
  expired:'รหัสหมดอายุหรือไม่ถูกต้อง กรุณาขอรหัสใหม่', locked:'กรอกผิดหลายครั้ง กรุณาขอรหัสใหม่',
  wrong:'รหัสไม่ถูกต้อง', msg_short:'กรุณาอธิบายอย่างน้อย 5 ตัวอักษร', msg_long:'ข้อความยาวเกินไป (ไม่เกิน 1,000 ตัวอักษร)',
  session:'หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง', forbidden:'ไม่มีสิทธิ์ดำเนินการ', not_found:'ไม่พบข้อมูลของคุณในระบบ กรุณาติดต่อเจ้าหน้าที่',
  generic:'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง'
};
const msg = e => ERR[e] || ERR.generic;

function call(fn){
  const args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(res){
    google.script.run.withSuccessHandler(res).withFailureHandler(function(){res({ok:false,error:'generic'})})[fn].apply(null,args);
  });
}
function h(tag, attrs){
  const n = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k];
    if (k==='class') n.className=v; else if (k==='text') n.textContent=v;
    else if (k.slice(0,2)==='on') n.addEventListener(k.slice(2),v); else if (v!==false && v!=null) n.setAttribute(k,v);
  }
  for (let i=2;i<arguments.length;i++){ const c=arguments[i]; if(c==null||c===false) continue; n.appendChild(typeof c==='string'?document.createTextNode(c):c); }
  return n;
}
function mount(node){ $view.replaceChildren(node); window.scrollTo(0,0); }
function setNav(btn){ $nav.replaceChildren(...(btn?[btn]:[])); }
function fmtDate(iso){ if(!iso) return ''; try{ return new Date(iso).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}) }catch(e){return iso} }
function num(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1); }
function toast(t){ const n=h('div',{class:'toast',role:'status',text:t}); document.body.appendChild(n); setTimeout(()=>n.remove(),4000); }
function badge(s){ const m={'':['b-pending','รอยืนยัน'],confirmed:['b-confirmed','ยืนยันแล้ว'],reported:['b-reported','รายงานปัญหา'],resolved:['b-resolved','เจ้าหน้าที่ตอบกลับ']}[s||''];
  return h('span',{class:'badge '+m[0],text:m[1]}); }

/* ---------- Login ---------- */
function viewLogin(prefill){
  stopPoll(); setNav(null);
  const email = h('input',{class:'field',id:'em',type:'email',inputmode:'email',autocomplete:'email',placeholder:'อีเมล @cmu.ac.th',value:prefill||''});
  const err = h('div',{class:'err',role:'alert',hidden:true});
  const btn = h('button',{class:'btn btn-primary',type:'submit',text:'ส่งรหัส OTP'});
  const form = h('form',{class:'form',onsubmit:async function(e){
    e.preventDefault(); err.hidden=true; btn.disabled=true; btn.textContent='กำลังส่ง…';
    const r = await call('requestOtp', email.value);
    btn.disabled=false; btn.textContent='ส่งรหัส OTP';
    if(!r.ok){ err.textContent=msg(r.error); err.hidden=false; return; }
    viewOtp(email.value.trim().toLowerCase());
  }}, h('label',{for:'em',text:'อีเมลมหาวิทยาลัยของคุณ'}), email, err, btn,
     h('p',{class:'hint',text:'เราจะส่งรหัส 6 หลักไปยังอีเมลของคุณ'}));
  const title = h('h1',null,'ตรวจสอบ',' ');
  title.replaceChildren(
    h('span',{class:'scribble'},'ตรวจสอบ',(function(){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 200 60');s.setAttribute('preserveAspectRatio','none');s.setAttribute('aria-hidden','true');
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M100 4C40 2 4 16 6 31c2 15 48 26 96 25 56-1 94-14 92-29C192 12 150 3 96 6');p.setAttribute('vector-effect','non-scaling-stroke');s.appendChild(p);return s})()),
    h('br'),'ชั่วโมง TA ของคุณ');
  mount(h('div',{class:'center'}, title,
    h('p',{class:'lead',text:'เข้าสู่ระบบด้วยอีเมล แล้วยืนยันว่าชั่วโมงปฏิบัติงานถูกต้อง หากไม่ถูกต้องสามารถรายงานให้เจ้าหน้าที่ได้ทันที'}),
    form, h('div',{class:'proof',text:'ภาคการศึกษาที่ 1 · ปีการศึกษา 2569'})));
  email.focus();
}

function viewOtp(emailAddr){
  const code = h('input',{class:'field otp',id:'cd',inputmode:'numeric',autocomplete:'one-time-code',maxlength:'6',pattern:'[0-9]*',placeholder:'••••••','aria-label':'รหัส OTP 6 หลัก'});
  const err = h('div',{class:'err',role:'alert',hidden:true});
  const btn = h('button',{class:'btn btn-primary',type:'submit',text:'เข้าสู่ระบบ'});
  const back = h('button',{class:'btn btn-ghost',type:'button',text:'← เปลี่ยนอีเมล / ขอรหัสใหม่',onclick:function(){viewLogin(emailAddr)}});
  const form = h('form',{class:'form',onsubmit:async function(e){
    e.preventDefault(); err.hidden=true; btn.disabled=true;
    const r = await call('verifyOtp', emailAddr, code.value);
    btn.disabled=false;
    if(!r.ok){ err.textContent = msg(r.error) + (r.error==='wrong'&&r.left!=null?' (เหลือ '+r.left+' ครั้ง)':''); err.hidden=false; code.select(); return; }
    token=r.token; store.set(token); boot();
  }}, h('label',{for:'cd',text:'รหัส OTP 6 หลัก'}), code, err, btn, back);
  mount(h('div',{class:'center'}, h('h1',{text:'ตรวจสอบอีเมลของคุณ'}),
    h('p',{class:'lead',text:'ส่งรหัสไปที่ '+emailAddr+' แล้ว (ใช้ได้ 10 นาที) หากไม่พบ โปรดดูในจดหมายขยะ'}), form));
  code.focus();
}

/* ---------- Student ---------- */
function viewStudent(me){
  stopPoll();
  setNav(h('button',{class:'btn btn-light',text:'ออกจากระบบ',onclick:doLogout}));
  const rec = me.record;
  const holder = h('div');
  const head = h('div',{class:'who'}, h('h2',{text:'สวัสดี '+rec.name}), h('p',{text:'รหัสนักศึกษา '+rec.id+' · '+me.term}));

  function draw(){
    const card = h('div',{class:'card'});
    card.appendChild(h('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap'},
      h('strong',{text:'ชั่วโมงปฏิบัติงานนักศึกษาช่วยงาน (TA)'}), badge(rec.status)));
    card.appendChild(h('div',{class:'stat-row'},
      stat('รอบที่ 1',num(rec.r1)), stat('รอบที่ 2',num(rec.r2)), stat('รวม',num(rec.total),true)));
    if(rec.status==='confirmed') card.appendChild(h('p',{class:'meta',text:'คุณยืนยันว่าถูกต้องเมื่อ '+fmtDate(rec.at)}));
    if(rec.status==='reported'||rec.status==='resolved'){
      if(rec.msg) card.appendChild(h('div',{class:'note'},h('b',{text:'ที่คุณรายงานไว้'}),rec.msg));
      if(rec.status==='reported') card.appendChild(h('p',{class:'meta',text:'ส่งรายงานเมื่อ '+fmtDate(rec.at)+' · เจ้าหน้าที่ได้รับแจ้งแล้ว รอการตรวจสอบ'}));
    }
    if(rec.status==='resolved') card.appendChild(h('div',{class:'note'},h('b',{text:'เจ้าหน้าที่ตอบกลับ'}),rec.reply||'ดำเนินการเรียบร้อย — โปรดตรวจสอบและยืนยันอีกครั้ง'));

    const panel = h('div',{class:'panel',hidden:true});
    const ta = h('textarea',{class:'field',id:'rep',maxlength:'1000',placeholder:'เช่น รอบที่ 1 ควรเป็น 45 ชั่วโมง เพราะ…'});
    const perr = h('div',{class:'err',role:'alert',hidden:true,style:'margin-top:8px'});
    const send = h('button',{class:'btn btn-primary',text:'ส่งรายงานให้เจ้าหน้าที่',onclick:async function(){
      perr.hidden=true; send.disabled=true;
      const r = await call('reportHours', token, ta.value);
      send.disabled=false;
      if(!r.ok){ perr.textContent=msg(r.error); perr.hidden=false; if(r.error==='session'){token=null;store.set(null);viewLogin();} return; }
      toast('ส่งรายงานให้เจ้าหน้าที่แล้ว'); refresh();
    }});
    panel.append(h('label',{for:'rep',text:'ระบุสิ่งที่ไม่ถูกต้อง'}),ta,perr,
      h('div',{class:'row'},send,h('button',{class:'btn btn-ghost',style:'color:#1A1A1A',text:'ยกเลิก',onclick:()=>{panel.hidden=true}})));

    const ok = h('button',{class:'btn btn-primary',text:rec.status==='confirmed'?'✓ ยืนยันแล้ว':'ยืนยันว่าถูกต้อง',disabled:rec.status==='confirmed',onclick:async function(){
      ok.disabled=true; const r = await call('confirmHours', token);
      if(!r.ok){ ok.disabled=false; toast(msg(r.error)); if(r.error==='session'){token=null;store.set(null);viewLogin();} return; }
      toast('ขอบคุณ ยืนยันเรียบร้อยแล้ว'); refresh();
    }});
    const no = h('button',{class:'btn btn-danger',text:'ไม่ถูกต้อง — รายงาน',onclick:()=>{panel.hidden=false;ta.focus()}});
    card.appendChild(h('div',{class:'actions'},ok,no)); card.appendChild(panel);
    holder.replaceChildren(card);
  }
  async function refresh(){ const r = await call('getMe',token); if(r.ok&&r.record){ Object.assign(rec,r.record); draw(); } }
  function stat(k,v,total){ return h('div',{class:'stat'+(total?' total':'')},h('div',{class:'k',text:k}),h('div',{class:'v'},v,h('small',{text:'ชม.'}))); }
  draw();
  mount(h('div',{style:'max-width:640px;margin:0 auto'},head,holder));
}

/* ---------- Staff ---------- */
function viewStaff(me){
  setNav(h('button',{class:'btn btn-light',text:'ออกจากระบบ',onclick:doLogout}));
  let data=null, filter='all', q='', open=null;
  const root = h('div');
  mount(h('div',null,h('div',{class:'who'},h('h2',{text:'สถานะการยืนยันชั่วโมง TA'}),h('p',{text:me.term+' · '+me.email})),root));

  async function load(first){
    const r = await call('staffList',token);
    if(!r.ok){ if(r.error==='forbidden'||r.error==='session'){token=null;store.set(null);viewLogin();} return; }
    if(lastReported!=null && r.counts.reported>lastReported) toast('มีนักศึกษารายงานเพิ่ม '+(r.counts.reported-lastReported)+' ราย');
    lastReported=r.counts.reported; data=r;
    document.title=(r.counts.reported?'('+r.counts.reported+') ':'')+'ยืนยันชั่วโมง TA';
    draw();
  }
  function draw(){
    const c=data.counts, frag=h('div');
    if(c.reported) frag.appendChild(h('div',{class:'alert',role:'alert'},'🔔 มีนักศึกษารายงานว่าไม่ถูกต้อง '+c.reported+' ราย',
      h('button',{class:'btn btn-light',text:'ดูเฉพาะที่รายงาน',onclick:()=>{filter='reported';draw()}})));
    frag.appendChild(h('div',{class:'stats'},sc('ทั้งหมด',c.total),sc('ยืนยันแล้ว',c.confirmed),sc('รายงานปัญหา',c.reported),sc('รอยืนยัน',c.pending)));
    const card=h('div',{class:'card'});
    const tool=h('div',{class:'tool'});
    [['all','ทั้งหมด'],['pending','รอยืนยัน'],['confirmed','ยืนยันแล้ว'],['reported','รายงานปัญหา'],['resolved','ตอบกลับแล้ว']].forEach(f=>{
      tool.appendChild(h('button',{class:'chip','aria-pressed':String(filter===f[0]),text:f[1],onclick:()=>{filter=f[0];draw()}}));});
    const search=h('input',{class:'field',type:'search',placeholder:'ค้นหาชื่อ / รหัส','aria-label':'ค้นหา',value:q,oninput:function(){q=this.value;drawList()}});
    tool.appendChild(search); card.appendChild(tool);
    const list=h('div',{class:'list',id:'list'}); card.appendChild(list); frag.appendChild(card);
    root.replaceChildren(frag); drawList();
    if(document.activeElement===document.body && q) search.focus();
  }
  function sc(k,v){ return h('div',{class:'stat'},h('div',{class:'k',text:k}),h('div',{class:'v',text:String(v)})); }
  function drawList(){
    const list=document.getElementById('list'); if(!list) return;
    const ql=q.trim().toLowerCase();
    const rows=data.rows.filter(r=>(filter==='all'||(r.status||'pending')===filter)&&(!ql||r.name.toLowerCase().includes(ql)||r.id.includes(ql)));
    rows.sort((a,b)=>(b.status==='reported')-(a.status==='reported'));
    const out=[h('div',{class:'lr head'},h('div',{text:'นักศึกษา'}),h('div',{text:'รอบ 1'}),h('div',{text:'รอบ 2'}),h('div',{text:'รวม'}),h('div',{text:'สถานะ'}))];
    if(!rows.length) out.push(h('div',{class:'empty',text:'ไม่พบรายการ'}));
    rows.forEach(r=>{
      const row=h('div',{class:'lr'},
        h('div',{class:'nm'},r.name,h('small',{text:r.id+(r.hasEmail?'':' · ⚠ ยังไม่มีอีเมลในระบบ')})),
        h('div',{class:'num',text:num(r.r1)}),h('div',{class:'num',text:num(r.r2)}),h('div',{class:'num',text:num(r.total)}),
        h('div',{class:'st'},badge(r.status),' ',r.at&&r.status?h('small',{style:'display:block;color:#55645A',text:fmtDate(r.at)}):null));
      if(r.status==='reported'||r.status==='resolved'){
        const d=h('div',{class:'detail'},h('b',{text:'ข้อความจากนักศึกษา: '}),r.msg||'-');
        if(r.status==='reported'){
          const reply=h('input',{class:'field',placeholder:'ข้อความตอบกลับนักศึกษา (ไม่บังคับ)','aria-label':'ข้อความตอบกลับ'});
          d.appendChild(h('div',{class:'row'},reply,h('button',{class:'btn btn-primary',text:'ดำเนินการแล้ว',onclick:async function(){
            this.disabled=true; const x=await call('staffResolve',token,r.id,reply.value);
            if(x.ok){toast('บันทึกแล้ว');load();} else {this.disabled=false;toast(msg(x.error));}
          }})));
        } else if(r.reply) d.appendChild(h('div',{style:'margin-top:6px'},h('b',{text:'ตอบกลับ: '}),r.reply));
        row.appendChild(d);
      }
      out.push(row);
    });
    list.replaceChildren(...out);
  }
  load(true); pollTimer=setInterval(load,60000);
}

function stopPoll(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} lastReported=null; document.title='ยืนยันชั่วโมง TA'; }
async function doLogout(){ const t=token; token=null; store.set(null); stopPoll(); if(t) call('logout',t); viewLogin(); }

async function boot(){
  if(!token) return viewLogin();
  mount(h('div',{class:'center'},h('p',{class:'lead',text:'กำลังโหลด…'})));
  const me = await call('getMe',token);
  if(!me.ok){ token=null; store.set(null); viewLogin(); if(me.error==='not_found') { const e=h('div',{class:'err',style:'max-width:420px;margin:16px auto'},msg(me.error)); $view.appendChild(e);} return; }
  me.role==='staff' ? viewStaff(me) : viewStudent(me);
}
boot();
})();
</script>
</body>
</html>
